name: Publish shared schedule issues
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-shared-schedules.yml'
      - 'schedules/scripts/publish-issues.mjs'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-schedule-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Sync encrypted schedules
        run: |
          set -eu
          git config user.name 'Hunt schedule publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- schedules/channels/
            node schedules/scripts/publish-issues.mjs
            git add -- schedules/channels/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish encrypted shared schedule updates'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
