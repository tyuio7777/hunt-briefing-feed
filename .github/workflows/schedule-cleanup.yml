name: Clean expired shared schedules
on:
  schedule:
    - cron: '23 19 * * *' # Daily at 04:23 KST; GitHub may delay execution.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schedule-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Delete expired encrypted records
        run: node schedules/scripts/cleanup.mjs
      - name: Commit only schedule data
        shell: bash
        run: |
          git config user.name 'Hunt schedule maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- schedules/channels
          if ! git diff --cached --quiet; then
            git commit -m 'Remove expired encrypted shared schedules'
            # Concurrent app writes must never be overwritten. Conflict aborts and retries next run.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
